server {
    listen 80;
    server_name localhost;

    # DNS interno embutido do Docker Swarm para resolução dinâmica de VIP
    resolver 127.0.0.11 valid=5s ipv6=off;

    # Endpoint de Health Check utilizado pelo Docker Swarm
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Página principal informando o status do Frontend
    location / {
        default_type text/html;
        return 200 '<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cluster Docker Swarm - Alta Disponibilidade</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 40px; margin: 0; }
        .card { background: #1e293b; border-radius: 12px; padding: 24px; max-width: 700px; margin: 0 auto; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #334155; }
        h1 { color: #38bdf8; margin-top: 0; }
        .badge { display: inline-block; padding: 6px 12px; border-radius: 9999px; font-size: 14px; font-weight: bold; background: #22c55e; color: #000; margin-bottom: 16px; }
        .info-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #334155; font-size: 15px; }
        .info-label { color: #94a3b8; }
        .info-value { font-weight: 600; color: #e2e8f0; font-family: monospace; }
        .btn { display: inline-block; background: #0284c7; color: white; padding: 10px 18px; border-radius: 8px; text-decoration: none; font-weight: bold; margin-top: 18px; }
        .btn:hover { background: #0369a1; }
    </style>
</head>
<body>
    <div class="card">
        <span class="badge">&#10004; Cluster Docker Swarm Ativo</span>
        <h1>Servi&ccedil;o Web Distribu&iacute;do</h1>
        <p>Esta inst&acirc;ncia do frontend est&aacute; em execu&ccedil;&atilde;o balanceada via <strong>Ingress Routing Mesh</strong>.</p>
        <div class="info-row">
            <span class="info-label">Host Frontend:</span>
            <span class="info-value">$hostname</span>
        </div>
        <div class="info-row">
            <span class="info-label">Rede Overlay Frontend:</span>
            <span class="info-value">frontend-net (10.10.1.0/24)</span>
        </div>
        <div class="info-row">
            <span class="info-label">Backend API Destino:</span>
            <span class="info-value">http://backend-api:80</span>
        </div>
        <div style="margin-top: 20px;">
            <a href="/api" class="btn">Testar Conex&atilde;o com Backend API &rarr;</a>
            <a href="http://localhost:8080" target="_blank" class="btn" style="background: #6366f1; margin-left: 10px;">Abrir Visualizador Swarm &rarr;</a>
        </div>
    </div>
</body>
</html>';
    }

    # Proxy reverso dinâmico para o serviço Backend API na rede frontend-net
    location /api {
        set $backend_target "http://backend-api:80";
        proxy_pass $backend_target;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }
}
