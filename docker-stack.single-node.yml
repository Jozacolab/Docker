version: '3.8'

services:
  # ============================================================================
  # SERVIÇO 1: FRONTEND (Serviço Web / Reverse Proxy)
  # ============================================================================
  frontend:
    image: nginx:alpine
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: ingress
    networks:
      - frontend-net
    configs:
      - source: nginx_conf
        target: /etc/nginx/conf.d/default.conf
    deploy:
      replicas: 3
      endpoint_mode: vip
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
        monitor: 15s
        max_failure_ratio: 0.1
      rollback_config:
        parallelism: 1
        delay: 5s
        order: stop-first
      resources:
        limits:
          cpus: '0.50'
          memory: 128M
        reservations:
          cpus: '0.10'
          memory: 64M
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ============================================================================
  # SERVIÇO 2: BACKEND API (Serviço de Negócio)
  # ============================================================================
  backend-api:
    image: nginxdemos/hello:plain-text
    networks:
      - frontend-net
      - backend-net
    deploy:
      replicas: 3
      endpoint_mode: vip
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
      resources:
        limits:
          cpus: '0.50'
          memory: 128M
        reservations:
          cpus: '0.10'
          memory: 64M
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ============================================================================
  # SERVIÇO 3: DATABASE / CACHE (Armazenamento de Estado)
  # ============================================================================
  database:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - db-data:/data
    networks:
      - backend-net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          cpus: '0.20'
          memory: 128M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ============================================================================
  # SERVIÇO 4: VISUALIZADOR DE CLUSTER (Monitoramento em tempo real)
  # ============================================================================
  visualizer:
    image: dockersamples/visualizer:latest
    ports:
      - target: 8080
        published: 8080
        protocol: tcp
        mode: ingress
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - frontend-net
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: '0.30'
          memory: 128M

# ==============================================================================
# CONFIGURAÇÃO DE REDES OVERLAY
# ==============================================================================
networks:
  frontend-net:
    driver: overlay
    attachable: true
    ipam:
      driver: default
      config:
        - subnet: 10.10.1.0/24
  backend-net:
    driver: overlay
    attachable: true
    ipam:
      driver: default
      config:
        - subnet: 10.10.2.0/24

# ==============================================================================
# VOLUMES PERSISTENTES
# ==============================================================================
volumes:
  db-data:
    driver: local

# ==============================================================================
# CONFIGURAÇÕES DECLARATIVAS
# ==============================================================================
configs:
  nginx_conf:
    file: ./nginx/default.conf

